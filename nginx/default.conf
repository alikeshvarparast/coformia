map $host $canonical_redirect {
  default 0;
  keshvarco.com 1;
  www.keshvarco.com 1;
  www.coformia.com 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  if ($canonical_redirect) {
    return 301 https://coformia.com$request_uri;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  location = /hooks/github {
    proxy_pass http://host.docker.internal:8096/hooks/github/coformia;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    client_max_body_size 1m;
  }

  location = /hooks/github/coformia {
    proxy_pass http://host.docker.internal:8096/hooks/github/coformia;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    client_max_body_size 1m;
  }

  location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:3000;
    proxy_http_version 1.1;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    client_max_body_size 32k;
  }

  location ~* ^/(theme\.css|marketing\.css|prose\.css|site\.js|ambient\.js|contact-form\.js|analytics\.js)$ {
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    try_files $uri =404;
  }

  location /images/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /formulane/ {
    return 301 /formulane;
  }

  location ^~ /banner/ {
    return 404;
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri.html $uri/ =404;
  }
}
